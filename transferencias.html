<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferencias</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="login">

    <h1>Transferencias</h1>
    <p>Prototipo académico de banca en línea</p>

    <label for="cuentaOrigen">Cuenta de origen</label>
    <select id="cuentaOrigen">
        <option value="">Seleccione una cuenta</option>
        <option value="ahorros">Cuenta de ahorros - 4587</option>
        <option value="corriente">Cuenta corriente - 9021</option>
    </select>

    <label for="cuentaDestino">Cuenta de destino</label>
    <input
        type="text"
        id="cuentaDestino"
        placeholder="Número de cuenta"
    >

    <label for="monto">Monto</label>
    <input
        type="number"
        id="monto"
        placeholder="Ejemplo: 100.00"
        min="1"
        step="0.01"
    >

    <label for="descripcion">Descripción</label>
    <input
        type="text"
        id="descripcion"
        placeholder="Motivo de la transferencia"
    >

    <button type="button" onclick="realizarTransferencia()">
        Realizar transferencia
    </button>

    <button
        type="button"
        class="boton-secundario"
        onclick="location.href='dashboard.html'"
    >
        Volver al panel
    </button>

    <p id="mensajeTransferencia"></p>

</div>

<script src="app.js"></script>

</body>
</html>
